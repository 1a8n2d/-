services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
  api:
    image: node:22-alpine
    working_dir: /app
    command: node server.mjs
    environment:
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-SVI}
    ports:
      - "8000:3001"
    volumes:
      - ./:/app
